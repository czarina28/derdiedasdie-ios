<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 217 48" role="img" aria-labelledby="title desc">
  <title id="title">derdiedasdie</title>
  <desc id="desc">Four rounded tiles reading der, die, das, die (plural)</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity=".13"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
