    <rect x="56" y="1" width="50" height="46" rx="10" fill="#ec4899"/>
    <rect x="111" y="1" width="50" height="46" rx="10" fill="#22a95b"/>
    <rect x="166" y="1" width="50" height="46" rx="10" fill="#f59e0b"/>
  </g>
  <g fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle">
    <text x="26" y="30">der</text><text x="81" y="30">die</text><text x="136" y="30">das</text><text x="191" y="30">die</text>
